workflows:
  android-apk-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Web Application
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd android
          gradle wrapper --gradle-version 8.14.3 || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - khinzarmg.myob@gmail.com
        notify:
          success: true
          failure: true
